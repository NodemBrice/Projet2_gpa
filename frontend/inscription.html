<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="css/styles1.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h1>Inscription</h1>
            <form>
                <div class="form-row">
                    <div class="input-group">
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" name="nom" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="prenom">Prénom</label>
                        <input type="text" id="prenom" name="prenom" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="input-group">
                        <label for="age">Âge</label>
                        <input type="number" id="age" name="age" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="sexe">Sexe</label>
                        <select id="sexe" name="sexe" required>
                            <option value="">Sélectionner</option>
                            <option value="homme">Homme</option>
                            <option value="femme">Femme</option>
                        </select>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="localisation">Localisation</label>
                    <input type="text" id="localisation" name="localisation" required>
                </div>
                
                <div class="form-row">
                    <div class="input-group">
                        <label for="nom_pere">Nom du père</label>
                        <input type="text" id="nom_pere" name="nom_pere" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="numero_pere">Numéro du père</label>
                        <input type="tel" id="numero_pere" name="numero_pere" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="input-group">
                        <label for="nom_mere">Nom de la mère</label>
                        <input type="text" id="nom_mere" name="nom_mere" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="numero_mere">Numéro de la mère</label>
                        <input type="tel" id="numero_mere" name="numero_mere" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn-primary">S'inscrire</button>
                
                <div class="form-footer">
                    <p>Déjà inscrit ? <a href="index.html">Se connecter</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
